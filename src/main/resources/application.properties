spring.main.banner-mode=off
logging.level.com.arbitrage=INFO

# ---- CAP-5: MySQL for the JDBC DAOs (DriverManager) -------------------------
db.url=jdbc:mysql://localhost:3306/arbitrage_db?createDatabaseIfNotExist=true&connectTimeout=3000&socketTimeout=5000
db.username=root
db.password=CHANGE_ME

# ---- CAP-5: socket feed defaults ------------------------------------------------
feed.default-host=localhost
feed.default-port=5050

# ---- CAP-6: embedded Tomcat (Servlets, JSP, sessions) -----------------------------
server.port=8080
# localhost only: the portal and the REST API are not reachable from other computers
server.address=127.0.0.1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ---- CAP-7: Spring Data JPA / Hibernate on the same MySQL database -----------------
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
# start even when MySQL is down; connections are made on first use
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
# the tables are created by DatabaseInitializer (JDBC), so Hibernate must not change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.show-sql=false
